name = "slashglow-planner"
main = "src/index.js"
compatibility_date = "2026-11-01"

# No request logs: visitors' messages must never be stored.
[observability]
enabled = false

[vars]
# Gemini model. Flash-Lite keeps a planning chat to a fraction of a cent.
# Check https://ai.google.dev/gemini-api/docs/models before launch.
MODEL = "gemini-3.5-flash-lite"
# Optional: "low" keeps replies fast on models that think by default.
# THINKING_LEVEL = "low"
ALLOWED_ORIGINS = "https://slashglow.com,https://www.slashglow.com,https://slashglow.app,http://localhost:8765"
LIMIT_PER_SESSION = "25"        # messages per browser per day
LIMIT_PER_IP = "60"             # messages per IP per day (generous: phones share IPs)
LIMIT_GLOBAL_MESSAGES = "1500"  # all visitors per day; the chat closes for the day after
LIMIT_GLOBAL_TOKENS = "3000000" # all visitors per day, in model tokens

# Glow AI (the app's assistant for beta testers, POST /ai)
# AI_MODEL = "gemini-3.5-flash"  # optional; defaults to MODEL above
LIMIT_AI_PER_CODE = "150"          # questions per invite code per day
LIMIT_AI_GLOBAL_MESSAGES = "3000"  # all testers per day
LIMIT_AI_GLOBAL_TOKENS = "6000000" # all testers per day, in model tokens

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   GEMINI_API_KEY    paid-tier Gemini API key
#   TURNSTILE_SECRET  Turnstile widget secret key
#   SESSION_SECRET    any long random string
#   IP_SALT           any long random string
#   GLOW_AI_KEY       Gemini key for Glow AI (the "/Glow AI" key)
#   GLOW_AI_CODES     beta invite codes, comma-separated (6+ characters each)

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
